[project]
name = "api"
version = "0.1.0"
description = "Backend FastAPI de Lindero: administra propiedades y chats de Telegram"
requires-python = ">=3.12"
dependencies = [
    "lindero-core",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "python-dotenv==1.2.3",
]

[tool.uv.sources]
lindero-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
