[project]
name = "lindero-core"
version = "0.1.0"
description = "Lógica de scraping y notificaciones compartida por el worker y la API de Lindero"
requires-python = ">=3.12"
dependencies = [
    "selenium==4.47.0",
    "webdriver-manager==4.1.2",
    "requests==2.34.2",
    "sqlmodel==0.0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lindero_core"]
